server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
openweathermap:
  api-key: ${OPENWEATHER_API_KEY:default_key}
  url: ${OPENWEATHER_URL:https://api.openweathermap.org/data/2.5/weather}
